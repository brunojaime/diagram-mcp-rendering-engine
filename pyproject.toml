[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-mcp-rendering-engine"
version = "0.1.0"
description = "Spec-first MCP rendering engine for deterministic UML component diagrams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1,<2",
]

[project.scripts]
diagram-mcp-rendering-engine = "diagram_mcp_rendering_engine.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
